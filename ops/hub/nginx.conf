server {
  listen 80;
  server_name _;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /api/frontend/health {
    proxy_pass http://frontend:5173/;
  }

  location /api/mcp/health {
    proxy_pass http://mcp-api:8000/healthz;
  }

  location /api/mcp/ready {
    proxy_pass http://mcp-api:8000/readyz;
  }

  location /api/playwright/health {
    proxy_pass http://playwright-mcp:8931/;
  }

  location /api/grafana/health {
    proxy_pass http://grafana:3000/api/health;
  }

  location /api/prometheus/health {
    proxy_pass http://prometheus:9090/-/healthy;
  }

  location /api/loki/health {
    proxy_pass http://loki:3100/ready;
  }

  location /api/tempo/health {
    proxy_pass http://tempo:3200/ready;
  }

  location /api/cadvisor/health {
    proxy_pass http://cadvisor:8080/healthz;
  }

  location /api/nodeexporter/health {
    proxy_pass http://node-exporter:9100/metrics;
  }
}
