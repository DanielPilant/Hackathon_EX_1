name: hackathon-ex-1

services:
  frontend:
    build:
      context: ./frontend/client
      dockerfile: Dockerfile.dev
    container_name: frontend-client
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
      VITE_FRAMES_WS_BASE_URL: ws://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      # Docker mode: show the real Chromium window via noVNC instead of WS screenshots
      VITE_BROWSER_VIEW_MODE: novnc
      VITE_NOVNC_URL: "http://localhost:6080/viewer.html"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/client:/app
      - /app/node_modules
    depends_on:
      mcp-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  ops-hub:
    image: nginx:1.27-alpine
    container_name: ops-hub
    ports:
      - "7070:80"
    volumes:
      - ./ops/hub/index.html:/usr/share/nginx/html/index.html:ro
      - ./ops/hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - mcp-api
      - playwright-mcp
      - grafana
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - app

  mcp-api:
    build:
      context: ./Backend
      dockerfile: MCP_Agent/Dockerfile.dev
    container_name: mcp-api
    working_dir: /app/MCP_Agent
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./Backend/MCP_Agent/.env
    environment:
      PLAYWRIGHT_MCP_URL: http://playwright-mcp:8931/mcp
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "true"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      OTEL_SERVICE_NAME: mcp-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    depends_on:
      playwright-mcp:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  playwright-mcp:
    build:
      context: .
      dockerfile: Backend/playwright-mcp/Dockerfile
    image: hackathon-playwright-mcp
    container_name: playwright-mcp
    # start.sh runs Xvfb + VNC + noVNC + Playwright MCP (headed, no --headless)
    ports:
      - "8931:8931"
      - "6080:6080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - app

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped
    networks:
      - app

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - app

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - app

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - app

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - app

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  promtail-data:
  tempo-data:
